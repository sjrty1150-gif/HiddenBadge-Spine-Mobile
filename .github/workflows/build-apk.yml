name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HiddenBadge_Spine_Mobile_GitHub_Upload_Pack.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack uploaded pack
        run: |
          rm -rf pack mobile-project
          mkdir -p pack mobile-project
          unzip -q HiddenBadge_Spine_Mobile_GitHub_Upload_Pack.zip -d pack
          unzip -q pack/UPLOAD_TO_REPO/HiddenBadgeSpineMobileProject.zip -d mobile-project

      - name: Build debug APK
        working-directory: mobile-project
        run: gradle --
